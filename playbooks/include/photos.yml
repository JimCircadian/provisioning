---
- name: Ensure podman is installed
  ansible.builtin.package:
    name: podman
    state: installed
  with_items:
    - podman

- name: Create the photos user
  ansible.builtin.user:
    name: photos
    create_home: yes

- name: Configure rootless Podman for deploy user
  ansible.builtin.command:
    cmd: loginctl enable-linger photos

- name: Modify home directory permissions for group
  ansible.builtin.file:
    path: /home/photos/
    mode: 0750

- name: Create directories necessary for librephotos
  ansible.builtin.file:
    path:   "/home/photos/{{ item }}"
    owner:  photos
    group:  photos
    state:  directory
  with_items:
    - data
    - db
    - protected_media
    - logs

- name: Modify data directory permissions for group
  ansible.builtin.file:
    path: /home/photos/data
    mode: g+w

#- name: Get stats of a file
#  ansible.builtin.stat:
