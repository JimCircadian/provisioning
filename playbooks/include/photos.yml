- name: Link to the current install compose
  ansible.builtin.template:
    src: photos/docker-compose.yml.j2
    dest: /home/photos/docker-compose.yml
    owner: photos
    group: photos

- name: Template the env configuration for use
  ansible.builtin.template:
    src: photos/env.j2
    dest: /home/photos/.env
    owner: photos
    group: photos
    mode: '0640'

- name: Replace
  ansible.builtin.replace:
    path: /home/photos/docker-compose.yml
    regexp: 'image: (reallibrephotos|pgautoupgrade)'
    replace: 'image: docker.io/\1'

- name: Pull images with Podman
  ansible.builtin.command:
    cmd: podman-compose pull
    chdir: /home/photos
  become: true
  become_user: "photos"

- name: Start application with Podman Compose
  ansible.builtin.command:
    cmd: podman-compose up -d
    chdir: /home/photos
  become: true
  become_user: "photos"

